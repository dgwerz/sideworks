<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DinoLand Café — Sidework Board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <span class="logo">🦕 DinoLand Café</span>
      <span class="subtitle">Sidework Board</span>
    </div>
    <div class="header-right">
      <div class="clock-block">
        <div id="clock" class="clock">--:-- --</div>
        <div id="date-display" class="date-label">Loading...</div>
      </div>
    </div>
  </header>

  <!-- TAB NAV -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="board">📋 Board</button>
    <button class="tab-btn" data-tab="admin">⚙️ Admin</button>
  </nav>

  <!-- BOARD TAB -->
  <main id="tab-board" class="tab-content active">
    <div id="board-grid" class="board-grid">
      <!-- Rendered by JS -->
    </div>
  </main>

  <!-- ADMIN TAB -->
  <main id="tab-admin" class="tab-content">
    <div class="admin-layout">

      <!-- PEOPLE MANAGEMENT -->
      <section class="admin-card">
        <h2>👥 People</h2>
        <div class="input-row">
          <input type="text" id="new-person-name" placeholder="Server name" maxlength="30" />
          <button onclick="addPerson()">Add</button>
        </div>
        <ul id="people-list" class="item-list">
          <!-- Rendered by JS -->
        </ul>
      </section>

      <!-- ASSIGN SIDEWORK -->
      <section class="admin-card">
        <h2>🎯 Assign Sidework</h2>
        <div class="form-group">
          <label>Person</label>
          <select id="assign-person"></select>
        </div>
        <div class="form-group">
          <label>Sidework</label>
          <select id="assign-sidework">
            <option value="Section 1">Section 1</option>
            <option value="Section 2">Section 2</option>
            <option value="Section 3">Section 3</option>
            <option value="Section 4">Section 4</option>
            <option value="Silverware">Silverware</option>
            <option value="No Sidework">No Sidework</option>
            <option value="Salad Bar">Salad Bar</option>
            <option value="Waitstation">Waitstation</option>
          </select>
        </div>
        <div class="form-group silverware-group" id="silverware-amount-group" style="display:none;">
          <label>Amount</label>
          <input type="number" id="silverware-amount" min="1" max="20" value="1" placeholder="Sets" />
        </div>
        <button class="btn-primary" onclick="assignSidework()">Assign</button>
      </section>

      <!-- MANAGE ASSIGNMENTS -->
      <section class="admin-card wide">
        <h2>📝 Current Assignments</h2>
        <table id="assignments-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Sidework</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="assignments-body">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </section>

      <!-- DANGER ZONE -->
      <section class="admin-card danger-zone">
        <h2>⚠️ Reset</h2>
        <p>Clear all assignments for today (keeps people).</p>
        <button class="btn-danger" onclick="clearAllAssignments()">Clear All Assignments</button>
        <p>Remove all people and assignments entirely.</p>
        <button class="btn-danger" onclick="clearEverything()">Clear Everything</button>
      </section>

    </div>
  </main>

  <!-- EDIT MODAL -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-box">
      <h3>Edit Sidework</h3>
      <p id="edit-modal-person" class="modal-person"></p>
      <div class="form-group">
        <label>Sidework</label>
        <select id="edit-sidework-select">
          <option value="Section 1">Section 1</option>
          <option value="Section 2">Section 2</option>
          <option value="Section 3">Section 3</option>
          <option value="Section 4">Section 4</option>
          <option value="Silverware">Silverware</option>
          <option value="No Sidework">No Sidework</option>
          <option value="Salad Bar">Salad Bar</option>
          <option value="Waitstation">Waitstation</option>
        </select>
      </div>
      <div class="form-group" id="edit-silverware-group" style="display:none;">
        <label>Amount</label>
        <input type="number" id="edit-silverware-amount" min="1" max="20" value="1" />
      </div>
      <div class="modal-actions">
        <button class="btn-primary" onclick="saveEdit()">Save</button>
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
